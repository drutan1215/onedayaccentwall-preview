<style>
:root{--cream:#F1ECE2;--ink:#17140F;--ink-soft:#3A342B;--ember:#D9782D;--ember-deep:#B65E1D;--line:rgba(23,20,15,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#0f0d0b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:540px;width:100%;background:var(--cream);border-radius:14px;padding:48px 40px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.check{width:64px;height:64px;border-radius:50%;background:var(--ember);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.check svg{width:30px;height:30px}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:700;font-size:1.7rem;letter-spacing:.01em;margin-bottom:14px}
h1 span{color:var(--ember)}
p{color:var(--ink-soft);line-height:1.6;margin-bottom:10px}
.phone{display:inline-block;margin-top:14px;font-family:'Oswald',sans-serif;font-weight:600;font-size:1.4rem;color:var(--ember);text-decoration:none;letter-spacing:.03em}
.btn{display:inline-block;margin-top:26px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:.9rem;padding:13px 26px;border-radius:4px;background:var(--ink);color:#fff;text-decoration:none;transition:background .15s ease}
.btn:hover{background:#000}
